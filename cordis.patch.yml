# Bundle patch for @royenheart/dsh-plugin-opencode-omo.
# The package's own host row: role registry service (`ctx.omoRoles`),
# `opencode-omo-roles` settings namespace, and the browser role/config HTTP
# routes. The bundle patch is the same layer that ships the preset, so the
# driver always finds the registry it reads.
#
# The `opencode-omo` agent preset itself is published through dsh's native
# USER preset root: install.py links `$DSH_HOME/.agent-presets/opencode-omo`
# to the package's `presets/opencode-omo`, which the agent-presets service
# always scans (includeUserRoot). No dsh-side patch or root-merging change is
# required.
#
# The preset enables dsh's native web_fetch tool (`fetch: true` in its
# `tool-web` row), so this bundle also declares the native HTTP fetch
# provider row for the shared `ctx.web` (see the disabled row below).
- insert:
    - id: opencode-omo
      name: '@royenheart/dsh-plugin-opencode-omo'

    # rc.2 deployment guard: the 0.1.1-rc.2 harness does not ship
    # @deepseek-ai/dsh-web-fetch-http, so an enabled row fails boot with
    # ERR_MODULE_NOT_FOUND. The row stays, disabled, to document the rc.2
    # delta (upstream 0.1.2 has no row: the base bundle already registers
    # the provider, and a second insert would throw WEB_DUPLICATE_PROVIDER).
    # RE-ENABLE when the harness provides the package.
    - id: opencode-omo-web-fetch
      name: '@deepseek-ai/dsh-web-fetch-http'
      disabled: true
