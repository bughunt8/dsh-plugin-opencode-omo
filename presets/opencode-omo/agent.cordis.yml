# The `opencode-omo` agent preset: opencode's toolchain and system prompt,
# plus omo (oh-my-openagent)'s multi-role subagent orchestration.
#
# This is an AGENT-PLANE composition mounted once per process under a standing
# scope; each session naming this preset joins by scope parentage. Host-plane
# rows (registries, sandbox, persistence, model route) stay in the web bundle.

# ── identity / loop shim ─────────────────────────────────────────────────────
# The `./driver.mjs` row registers opencode's complete system prompt
# (persona.md + omo Sisyphus identity) as a DYNAMIC system-prompt section on
# the native `systemPrompt` seam. Its text provider prepends opencode's live
# <env> block and swaps in the selected omo role's prompt per assembly, and its
# listeners apply opencode tool gating, maxSteps, ultrawork, and role model
# fallback — no dsh-side driver seam required.
- id: opencode-omo-loop
  name: ./driver.mjs

# AGENTS.md / CLAUDE.md walk-up injection, mirroring opencode's instruction loading.
- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── rules injection ─────────────────────────────────────────────────────────
# omo's rules-injector text is folded into the complete system prompt by
# driver.mjs (a systemPrompt.context row would be dropped together with the
# suppressed runtime context).
#
# ── comment-checker hook ────────────────────────────────────────────────────
# omo's comment-checker: reject AI-slop comments on write/edit before execution.
- id: opencode-omo-comment-checker
  name: ./comment-checker.mjs

# opencode external_directory + doom_loop permission rules (tools/pre-execute).
- id: opencode-omo-permission-rules
  name: ./permission-rules.mjs

# bash sandbox-escalation shim: the stock persistent bash carries none of
# tool-bash's sandbox_permissions/approval contract, so under workspace-write
# an out-of-workspace write dead-ends at EROFS. This per-agent shim adds the
# contract back using only public dsh services (see the module header).
- id: opencode-omo-escalating-bash
  name: ./escalating-bash.mjs

# ── lsp ─────────────────────────────────────────────────────────────────────
# omo's LSP surface (goto-definition, references, symbols, hover). Scoped to this
# preset via an isolate realm; a TypeScript/JS server is preconfigured.
- id: lsp
  name: cordis:group
  group: true
  isolate:
    lsp: true
  config:
    - id: lsp-service
      name: '@deepseek-ai/dsh-lsp'

    - id: lsp-stdio
      name: '@deepseek-ai/dsh-lsp-stdio'
      # Graceful degradation: without the server binary this row disables itself
      # (lsp-service + tool-lsp stay mounted), so the whole preset still loads.
      disabled: !!js '!(function () { try { const { spawnSync } = process.getBuiltinModule("node:child_process"); return spawnSync("typescript-language-server", ["--version"], { stdio: "ignore", timeout: 5000 }).error === undefined } catch { return false } })()'
      config:
        servers:
          typescript:
            command: typescript-language-server
            args:
              - --stdio
            extensionToLanguage:
              .ts: typescript
              .tsx: typescriptreact
              .js: javascript
              .jsx: javascriptreact

    - id: tool-lsp
      name: '@deepseek-ai/dsh-tool-lsp'

# ── shell ───────────────────────────────────────────────────────────────────
# opencode's shell is persistent; dsh's fresh `tool-bash` is replaced with the
# persistent PTY-backed bash so state survives across calls, matching opencode.
- id: persistent-shell
  name: cordis:group
  group: true
  isolate:
    terminals: true
  config:
    - id: pty
      name: '@deepseek-ai/dsh-terminal'

    - id: terminal-bash
      name: '@deepseek-ai/dsh-terminal-bash'
      config:
        timeoutMs: 300000

    - id: persistent-bash
      name: '@deepseek-ai/dsh-tool-bash-persistent'
      config:
        timeoutMs: 300000
        description: |-
          Run commands in a bash shell.
          * State is persistent across command calls and discussions with the user.
          * To inspect a particular line range of a file, e.g. lines 10-25, try 'sed -n 10,25p /path/to/the/file'.
          * Please avoid commands that may produce a very large amount of output.
          * Please run long-lived commands in the background, e.g. 'sleep 10 &' or start a server in the background.
          * Chain independent commands with ';' or '&&' to batch them in one call.

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────
# opencode's execution backend is the raw local filesystem. Give this mode its
# own `ctx.fs` (local, full-access, session-cwd-resolved) in an isolate realm so
# file tools use opencode's fs semantics and other modes keep the sandboxed host fs.
- id: filesystem
  name: cordis:group
  group: true
  isolate:
    fs: true
  config:
    - id: fs-local
      name: '@deepseek-ai/dsh-fs-local'

    - id: tool-fs
      name: '@deepseek-ai/dsh-tool-fs'

    - id: tool-fs-search
      name: '@deepseek-ai/dsh-tool-fs-search'
      config:
        sampleOverCapGlobResults: false

    # apply_patch and hashline live in this realm so they use the same local fs
    # as read/write/edit (full access, matching opencode's execution backend).
    - id: opencode-omo-apply-patch
      name: ./apply-patch.mjs

    - id: opencode-omo-tool-surface
      name: ./tool-surface.mjs

    - id: opencode-omo-hashline
      name: ./hashline.mjs

# ── background jobs ────────────────────────────────────────────────────────
- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────
# omo ships its skills beside the plugin. `omo-skills.mjs` registers them as
# `user-dsh`-sourced skills (not `custom`), so the third-party
# @maintainall/dsh-plugin-skills-manager recognises and can enable/disable
# them through its existing global/workspace/session override store without
# any change to that plugin. The native filesystem provider keeps its default
# project/user roots.
- id: omo-skills
  name: ./omo-skills.mjs

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── omo builtin commands ─────────────────────────────────────────────────────
# Native dsh command registrations for the omo slash-command surface.
- id: opencode-omo-commands
  name: ./omo-commands.mjs

# ── goals ───────────────────────────────────────────────────────────────────
# omo's goal feature (create_goal / get_goal / update_goal) maps here.
- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── plan mode ───────────────────────────────────────────────────────────────
# opencode's plan agent (plan_enter / plan_exit) maps here.
- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

# ── compaction ──────────────────────────────────────────────────────────────
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation and workflows ────────────────────────────────────────────────
# omo's multi-role subagents: each named subagent tool carries its own persona
# and tool restrictions, so the orchestrator picks a specialist by name.
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    # omo's read-only specialist subagents.
    - id: role-oracle
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: oracle
        enableRunInBackground: false
        persona: !!js "process.getBuiltinModule('node:fs').readFileSync(process.getBuiltinModule('node:url').fileURLToPath(new URL('roles/prompts/variants/specialists/oracle-default.md', baseUrl)), 'utf8')"
        toolFilter:
          deny:
            - write
            - edit
            - task
            - subagent
            - subagent_fork
            - oracle
            - librarian
            - explore
            - metis
            - momus
            - multimodal-looker
            - workflow
            - ralph

    - id: role-librarian
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: librarian
        enableRunInBackground: false
        persona: !!js "process.getBuiltinModule('node:fs').readFileSync(process.getBuiltinModule('node:url').fileURLToPath(new URL('roles/prompts/variants/rendered/librarian.md', baseUrl)), 'utf8')"
        toolFilter:
          deny:
            - write
            - edit
            - task
            - subagent
            - subagent_fork
            - oracle
            - librarian
            - explore
            - metis
            - momus
            - multimodal-looker
            - workflow
            - ralph

    - id: role-explore
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: explore
        enableRunInBackground: false
        persona: !!js "process.getBuiltinModule('node:fs').readFileSync(process.getBuiltinModule('node:url').fileURLToPath(new URL('roles/prompts/variants/specialists/explore.md', baseUrl)), 'utf8')"
        toolFilter:
          deny:
            - write
            - edit
            - task
            - subagent
            - subagent_fork
            - oracle
            - librarian
            - explore
            - metis
            - momus
            - multimodal-looker
            - workflow
            - ralph

    - id: role-metis
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: metis
        enableRunInBackground: false
        persona: !!js "process.getBuiltinModule('node:fs').readFileSync(process.getBuiltinModule('node:url').fileURLToPath(new URL('roles/prompts/variants/rendered/metis-default.md', baseUrl)), 'utf8')"
        toolFilter:
          deny:
            - write
            - edit
            - task
            - subagent
            - subagent_fork
            - oracle
            - librarian
            - explore
            - metis
            - momus
            - multimodal-looker
            - workflow
            - ralph

    - id: role-momus
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: momus
        enableRunInBackground: false
        persona: !!js "process.getBuiltinModule('node:fs').readFileSync(process.getBuiltinModule('node:url').fileURLToPath(new URL('roles/prompts/variants/specialists/momus-default.md', baseUrl)), 'utf8')"
        toolFilter:
          deny:
            - write
            - edit
            - task
            - subagent
            - subagent_fork
            - oracle
            - librarian
            - explore
            - metis
            - momus
            - multimodal-looker
            - workflow
            - ralph

    - id: role-looker
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: multimodal-looker
        enableRunInBackground: false
        persona: !!js "process.getBuiltinModule('node:fs').readFileSync(process.getBuiltinModule('node:url').fileURLToPath(new URL('roles/prompts/variants/specialists/multimodal-looker.md', baseUrl)), 'utf8')"
        toolFilter:
          allow:
            - read
            - read_image

    # omo's primary agents are also delegatable named subagents in the
    # reference roster. These reuse the same complete role prompts as the
    # composer selector; recursion into subagent/workflow tools is denied so a
    # worker cannot silently spawn another orchestrator tree.
    - id: role-sisyphus
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: sisyphus
        persona: !!js "process.getBuiltinModule('node:fs').readFileSync(process.getBuiltinModule('node:url').fileURLToPath(new URL('persona.md', baseUrl)), 'utf8')"
        toolFilter:
          deny:
            - task
            - subagent
            - subagent_fork
            - oracle
            - librarian
            - explore
            - metis
            - momus
            - multimodal-looker
            - sisyphus
            - hephaestus
            - atlas
            - sisyphus-junior
            - workflow
            - ralph

    - id: role-hephaestus
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: hephaestus
        persona: !!js "process.getBuiltinModule('node:fs').readFileSync(process.getBuiltinModule('node:url').fileURLToPath(new URL('roles/prompts/hephaestus.md', baseUrl)), 'utf8')"
        toolFilter:
          deny:
            - task
            - subagent
            - subagent_fork
            - oracle
            - librarian
            - explore
            - metis
            - momus
            - multimodal-looker
            - sisyphus
            - hephaestus
            - atlas
            - sisyphus-junior
            - workflow
            - ralph

    - id: role-atlas
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: atlas
        persona: !!js "process.getBuiltinModule('node:fs').readFileSync(process.getBuiltinModule('node:url').fileURLToPath(new URL('roles/prompts/atlas.md', baseUrl)), 'utf8')"
        toolFilter:
          deny:
            - task
            - subagent
            - subagent_fork
            - oracle
            - librarian
            - explore
            - metis
            - momus
            - multimodal-looker
            - sisyphus
            - hephaestus
            - atlas
            - sisyphus-junior
            - workflow
            - ralph

    - id: role-sisyphus-junior
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: sisyphus-junior
        persona: !!js "process.getBuiltinModule('node:fs').readFileSync(process.getBuiltinModule('node:url').fileURLToPath(new URL('roles/prompts/sisyphus-junior.md', baseUrl)), 'utf8')"
        toolFilter:
          deny:
            - task
            - subagent
            - subagent_fork
            - oracle
            - librarian
            - explore
            - metis
            - momus
            - multimodal-looker
            - sisyphus
            - hephaestus
            - atlas
            - sisyphus-junior
            - workflow
            - ralph

    - id: opencode-omo-task-shim
      name: ./task-shim.mjs

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# opencode's websearch / webfetch.
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: true
    searchTimeoutMs: 60000
